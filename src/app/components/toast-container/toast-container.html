<div class="toast-container position-fixed top-0 end-0 p-3 toast-stack">
  @for (m of notify.mensajes(); track m.id) {
    <div class="toast show align-items-center border-0 text-bg-{{ m.tipo }}" role="alert" aria-live="assertive">
      <div class="d-flex">
        <div class="toast-body">{{ m.texto }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                aria-label="Cerrar" (click)="notify.remover(m.id)"></button>
      </div>
    </div>
  }
</div>
