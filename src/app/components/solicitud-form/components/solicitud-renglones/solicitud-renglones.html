<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h5 class="fw-bold mb-0">Renglones de Gasto</h5>
    <small class="text-muted">Total ítems: {{ renglones().length }}</small>
  </div>
  <button type="button" class="btn btn-sm btn-outline-primary" (click)="onAgregar()">
    <i class="bi bi-plus-lg me-1"></i>Agregar Ítem
  </button>
</div>
 
<div class="table-responsive mb-4">
  <table class="table table-bordered align-middle tabla-renglones">
    <thead class="table-light">
      <tr>
        <th>Concepto</th>
        <th class="col-cantidad">Cantidad</th>
        <th class="col-precio">Precio Unit. (S/)</th>
        <th class="col-importe text-end">Importe</th>
        <th class="col-accion"></th>
      </tr>
    </thead>
    <tbody>
      @for (d of renglones(); track $index; let i = $index) {
        <tr>
          <td>
            <input
              type="text"
              class="form-control form-control-sm"
              [value]="d.concepto"
              (input)="onConceptoChange(i, $event)"
              placeholder="Descripción del ítem"
              required
            />
          </td>
          <td>
            <input
              type="number"
              class="form-control form-control-sm"
              [value]="d.cantidad"
              (input)="onCantidadChange(i, $event)"
              min="1"
              required
            />
          </td>
          <td>
            <input
              type="number"
              class="form-control form-control-sm"
              [value]="d.precioUnitario"
              (input)="onPrecioChange(i, $event)"
              min="0.1"
              step="0.1"
              required
            />
          </td>
          <td class="text-end fw-bold">
            S/ {{ (d.cantidad * d.precioUnitario) | number:'1.2-2' }}
          </td>
          <td class="text-center">
            <button
              type="button"
              class="btn btn-sm text-danger"
              (click)="onEliminar(i)"
              [disabled]="!puedeEliminar()"
              title="Eliminar renglón"
            >
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
    <tfoot>
      <tr class="table-light fw-bold">
        <td colspan="3" class="text-end">TOTAL ESTIMADO:</td>
        <td class="text-end text-success fs-5">S/ {{ totalEstimado() | number:'1.2-2' }}</td>
        <td></td>
      </tr>
    </tfoot>
  </table>
</div>
