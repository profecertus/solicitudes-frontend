<app-navbar></app-navbar>

 
<div class="container-fluid">
  <div class="row">

    <nav class="col-md-3 col-lg-2 d-md-block sidebar-nav p-3">

        <li class="nav-item">
          <a class="nav-link rounded px-3 py-2 text-dark"
             routerLink="/dashboard"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-wallet2 me-2"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link rounded px-3 py-2 text-dark"

          <a class="nav-link rounded px-3 py-2 text-secondary" href="javascript:void(0)">

        <li class="nav-item">

    </nav>
 
    <!-- Main Content View -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
      <router-outlet></router-outlet>
    </main>
