<nav class="navbar navbar-expand-lg navbar-dark shadow-sm nh-navbar">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <i class="bi bi-layers-half fs-3 text-warning"></i>
            <div>
                <div class="fw-bold fs-5 lh-1">SolicitudesApp</div>
                <small class="text-white-50 nh-navbar_subtitulo">Portal de Compras y Tesorería</small>
            </div>
        </a>
        <!-- Selector Interactivo de Rol Activo para el Docente / Estudiantes y Cerrar Sesión -->
        <div class="d-flex align-items-center gap-2 ms-auto">
            <div class="input-group input-group-sm">
            <span class="input-group-text bg-white bg-opacity-25 border-0 text-white px-2">
                <i class="bi bi-person-badge"></i>
                <span class="d-none d-sm-inline ms-1 small">Rol:</span>
            </span>
            <select
                class="form-select form-select-sm border-0 fw-semibold text-dark shadow-sm bg-white"
                style="min-width: 170px;"
                (change)="onRolChange($event)"
            >
                @for (item of rolService.rolesDisponibles(); track item.rol) {
                    <option [value]="item.rol" [selected]="item.rol === rolService.usuarioActual().rol">
                        {{ item.nombre }} ({{ item.titulo }})
                    </option>
                }
            </select>
            </div>

            <!-- Botón Cerrar Sesión -->
            <button
                type="button"
                class="btn btn-outline-light btn-sm d-flex align-items-center gap-1 shadow-sm px-2 px-md-3"
                (click)="cerrarSesion()"
                title="Cerrar Sesión">
                <i class="bi bi-box-arrow-right"></i>
                <span class="d-none d-sm-inline">Salir</span>
            </button>
        </div>
    </div>    
</nav>
