<nav class="navbar navbar-expand-lg navbar-dark shadow-sm nh-navbar">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <i class="bi bi-layers-half fs-3 text-warning"></i>
            <div>
                <div class="fw-bold fs-5 lh-1">SolicitudesApp</div>
                <small class="text-white-50 nh-navbar_subtitulo">Portal de Compras y Tesorería</small>
            </div>
        </a>
        <!-- Indicador de Usuario Autenticado, JWT TTL y Cerrar Sesión -->
        <div class="d-flex align-items-center gap-2 ms-auto">
            @if (authService.currentUser(); as user) {
                <button
                    type="button"
                    class="btn btn-sm btn-dark bg-opacity-50 border border-light border-opacity-25 d-flex align-items-center gap-2 text-white px-3 py-1"
                    (click)="verificarTokenServidor()"
                    title="Clic para validar el token JWT y su TTL contra GET /api/auth/me">
                    <i class="bi bi-person-circle text-info"></i>
                    <span class="small fw-semibold">{{ user.nombre }} (@{{ user.username }})</span>
                    <span
                        class="badge ms-1"
                        [class.bg-danger]="authService.ttlRestanteSegundos() <= 10"
                        [class.bg-warning]="authService.ttlRestanteSegundos() > 10"
                        [class.text-dark]="authService.ttlRestanteSegundos() > 10"
                        [class.text-white]="authService.ttlRestanteSegundos() <= 10">
                        <i class="bi bi-stopwatch me-1"></i>TTL: {{ authService.ttlFormateado() }}
                    </span>
                </button>
            }

            <!-- Botón Cerrar Sesión -->
            <button
                type="button"
                class="btn btn-outline-light btn-sm d-flex align-items-center gap-1 shadow-sm px-2 px-md-3"
                (click)="cerrarSesion()"
                title="Cerrar Sesión">
                <i class="bi bi-box-arrow-right"></i>
                <span class="d-none d-sm-inline">Salir</span>
            </button>
        </div>
    </div>    
</nav>
